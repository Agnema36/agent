<title>Последняя станция</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=PT+Sans+Narrow:wght@700&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Mono&display=swap">
<style>
/* Layout: full-bleed canvas colony view; HUD floats on top (resources top, hope/discontent bottom-centre, build bar bottom, info panel right). Single dark look: frostbitten steel + sodium-lamp amber. */
:root{
  --ink:#0b0e12;         /* deep tunnel black */
  --steel:#1a2129;       /* panel body */
  --steel-2:#232c36;     /* raised panel */
  --rim:#3b4856;         /* panel edge */
  --frost:#cfe3f2;       /* main text, frost white */
  --frost-dim:#8ea3b5;   /* secondary text */
  --amber:#f2a33a;       /* lamp light, accent */
  --amber-dim:#9a6522;
  --ok:#7fc48a; --warn:#e8c25a; --bad:#e06450; --cold:#6fb6e0;
  /* типографика: шрифты меняются только здесь (все с кириллицей, Google Fonts) */
  --font-display:'Russo One','Arial Black',Impact,sans-serif;   /* акцент: название игры и заголовки окон */
  --font-heading:'PT Sans Narrow','Arial Narrow',sans-serif;    /* заголовки, названия, кнопки (700, капс) */
  --font-body:'PT Sans','Trebuchet MS',Arial,sans-serif;        /* описания */
  --font-mono:'PT Mono',ui-monospace,Menlo,Consolas,monospace;  /* числа */
  --fs-12:12px;--fs-13:13px;--fs-14:14px;--fs-16:16px;--fs-20:20px;--fs-28:28px;--fs-40:40px;
  --ls-heading:.06em;
  --c-title:#eef3f7;--c-desc:#9AA4B0;--c-cost:#f2a33a;--c-status:#7d8792;
  --display:var(--font-heading);--body:var(--font-body);--mono:var(--font-mono);
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--frost);font:var(--fs-14)/1.4 var(--body)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#game,#g3{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
#g3{pointer-events:none}
.hud{position:fixed;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.panel{--brass:#b08a4e;background:radial-gradient(120% 140% at 50% 0%,rgba(255,255,255,.05),transparent 60%),linear-gradient(180deg,#232a31,#151a1f);border:1px solid #06080a;box-shadow:0 8px 24px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06),inset 0 0 0 1px rgba(120,100,70,.18);border-radius:2px}
.panel::before{content:"";position:absolute;inset:3px;border:1px solid rgba(176,138,78,.22);pointer-events:none}
.panel::after{content:"";position:absolute;inset:0;pointer-events:none;background:
 linear-gradient(var(--brass),var(--brass)) left top/12px 2px no-repeat,linear-gradient(var(--brass),var(--brass)) left top/2px 12px no-repeat,
 linear-gradient(var(--brass),var(--brass)) right top/12px 2px no-repeat,linear-gradient(var(--brass),var(--brass)) right top/2px 12px no-repeat,
 linear-gradient(var(--brass),var(--brass)) left bottom/12px 2px no-repeat,linear-gradient(var(--brass),var(--brass)) left bottom/2px 12px no-repeat,
 linear-gradient(var(--brass),var(--brass)) right bottom/12px 2px no-repeat,linear-gradient(var(--brass),var(--brass)) right bottom/2px 12px no-repeat}
#res,#temp,#clock,#meters,#bar,#cards,#info>*{position:relative}
#res,#temp,#clock,#meters,#bar,#cards{position:relative}
.title{font-family:var(--font-heading);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-heading);font-weight:500}
#danger{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(200,20,10,.6) 0%,rgba(160,10,0,.22) 9%,rgba(160,10,0,0) 20%,rgba(160,10,0,0) 80%,rgba(160,10,0,.22) 91%,rgba(200,20,10,.6) 100%)}
#evfeed{right:max(10px,env(safe-area-inset-right,0px));top:calc(206px + env(safe-area-inset-top,0px));width:300px;max-width:calc(100vw - 20px);padding:6px 8px;pointer-events:auto;display:flex;flex-direction:column;gap:2px}
#evfeed[hidden]{display:none}
.evh{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-heading);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-heading);font-size:var(--fs-13);color:var(--amber);padding:0 2px 3px}
.evh button{background:none;border:1px solid var(--rim);color:var(--frost-dim);font:var(--fs-12) var(--font-heading);text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;cursor:pointer}
.evr{display:flex;gap:7px;align-items:flex-start;width:100%;text-align:left;background:rgba(10,13,16,.55);border:0;border-left:3px solid var(--ec);padding:4px 6px;color:var(--frost);cursor:pointer;font:var(--fs-13)/1.3 var(--font-body)}
.evr:hover{background:rgba(40,48,56,.8)}
.evr svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--ec)}
.evr .et{flex:1;min-width:0}.evr .tm{font:var(--fs-12) var(--font-mono);color:var(--c-status);white-space:nowrap;margin-left:4px}
.evr.death .et{color:#ffc2b6}.evr.info .et{color:var(--c-desc)}
.evf{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}.evf button.on{border-color:var(--amber);color:var(--amber)}
.evlist{display:flex;flex-direction:column;gap:3px;max-height:60vh;overflow:auto}
@media (max-width:760px){#evfeed{display:none}}
#wavebanner{position:fixed;left:50%;top:calc(6px + env(safe-area-inset-top,0px));display:flex;align-items:baseline;gap:14px;white-space:nowrap;transform:translate(-50%,0) scale(.96);z-index:18;pointer-events:none;text-align:center;opacity:0;transition:opacity .25s,transform .25s;padding:6px 22px;background:rgba(40,8,6,.92);border:1px solid #c0392b;box-shadow:0 0 30px rgba(192,57,43,.45)}
#wavebanner.on{opacity:1;transform:translate(-50%,0) scale(1);transition:none}
#wavebanner .wb1{font-family:var(--font-heading);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-heading);font-size:var(--fs-20);color:#ffd9cf}
#wavebanner .wb2{font-family:var(--mono);font-size:var(--fs-14);color:#ff9b85}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
#top{top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;gap:8px;padding:8px max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));align-items:flex-start;flex-wrap:wrap}
#res{display:flex;flex-wrap:wrap;gap:2px;padding:4px 6px;max-width:100%}
.res{display:flex;align-items:center;gap:4px;padding:2px 5px;min-width:62px;border-right:1px solid rgba(255,255,255,.06)}
.res:last-child{border-right:0}
.res svg{width:26px;height:26px;flex:none;padding:2px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#2b3239,#0e1215);box-shadow:inset 0 0 0 1px rgba(176,138,78,.35)}
.res .v{font-family:var(--mono);font-size:var(--fs-13)}
.res .d{font-family:var(--mono);font-size:var(--fs-12);color:var(--frost-dim)}
.res .d.neg{color:var(--bad)} .res .d.pos{color:var(--ok)}
#clock{margin-left:auto;display:flex;align-items:center;gap:10px;padding:5px 10px}
#clock .day{font-family:var(--font-heading);font-weight:700;font-size:var(--fs-20);letter-spacing:var(--ls-heading)}
#warn{flex-basis:100%;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;pointer-events:none;margin-top:2px}
#warn:empty{display:none}
.zbest{display:flex;flex-wrap:wrap;gap:2px 6px;margin-top:5px}.zb{display:flex;flex-direction:column;align-items:center;width:44px;text-align:center}.zb small{font-size:var(--fs-12);line-height:1.1;color:var(--frost-dim)}.zb.off{opacity:.45}
@media (min-width:900px){#warn{padding-left:330px;padding-right:20px;justify-content:flex-start}body.noneeds #warn{padding-left:0;justify-content:center}}
.wchip{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:4px 10px;font-size:var(--fs-12);background:rgba(14,18,22,.9);border:1px solid #3b4856;border-left:3px solid #e8c25a;color:var(--frost);max-width:min(560px,92vw)}
.wchip.bad{border-left-color:#e06450;background:rgba(48,16,12,.92)}.wchip.cold{border-left-color:#7fb8e6;background:rgba(14,26,40,.92)}
.wchip .wi{font-size:var(--fs-14)}
#temp{display:flex;flex-direction:column;gap:4px;padding:4px 10px 6px 6px;pointer-events:auto}
#temp .tnow{display:flex;align-items:center;gap:8px}
.fc3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:300px;max-width:calc(100vw - 30px)}
.fcd{background:rgba(10,13,16,.55);border-top:2px solid var(--rim);padding:4px 6px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fcd .h{font-family:var(--font-heading);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-heading);font-size:var(--fs-12);color:var(--c-title)}
.fcd .t{font-family:var(--font-mono);font-size:var(--fs-12);color:var(--cold);font-variant-numeric:tabular-nums;white-space:nowrap}
.fcd .t.dg,.fcd .m.dg{color:#ff7a66}.fcd .e{font-size:var(--fs-12);color:#bcd6ea;font-style:italic}
.fcd .m{font-size:var(--fs-12);color:var(--c-desc);line-height:1.25}.fcd .zi{display:flex;gap:1px;flex-wrap:wrap}.fcd .zi svg{width:15px;height:15px}
.fcd.dg{border-top-color:#e06450}
.fch{display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:0 2px;color:var(--frost-dim);font:700 var(--fs-12) var(--font-heading);text-transform:uppercase;letter-spacing:var(--ls-heading);cursor:pointer;width:100%}
.fch:hover{color:var(--amber)}
@media (max-width:760px){.fc3{width:auto}}
#temp svg.gauge{width:84px;height:50px;flex:none}
#temp .deg{font-family:var(--font-heading);font-weight:700;font-size:var(--fs-20);color:var(--cold)}
#temp .fc{display:flex;gap:6px;font-family:var(--mono);font-size:var(--fs-12);color:var(--frost-dim)}
.speed{display:flex;gap:2px}
.speed button{width:30px;height:26px;background:var(--steel);border:1px solid var(--rim);border-radius:2px;font-family:var(--mono);font-size:var(--fs-12)}
.speed button.on{background:var(--amber);color:#1b1206;border-color:var(--amber)}
.iconbtn{height:30px;padding:0 10px;background:var(--steel);border:1px solid var(--rim);border-radius:2px;font-family:var(--font-heading);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-heading);font-size:var(--fs-12)}
.iconbtn:hover{border-color:var(--amber)}

/* bottom */
#bottom{left:0;right:0;bottom:0;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:6px}
#meters{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;padding:6px 14px;align-items:center;max-width:100%}
.meter{display:flex;align-items:center;gap:8px}
.meter .bar{width:150px;height:10px;background:#0d1217;border:1px solid var(--rim);position:relative;overflow:hidden}
.meter .fill{position:absolute;inset:0 auto 0 0}
.meter.hope .fill{background:linear-gradient(90deg,#2f6fa8,#6fb6f0)}
.meter.hope.low .fill{background:linear-gradient(90deg,#8a2d22,#f06a4a)}
.meter.hope.low .num{color:var(--bad)}
.meter{cursor:help}
#tip{position:fixed;z-index:30;width:300px;max-width:calc(100vw - 20px);padding:10px 12px;pointer-events:none}
#tip .trow{display:flex;justify-content:space-between;gap:10px;font-size:var(--fs-12);padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
#tip .trow b{font-family:var(--mono);font-weight:400}#tip .up{color:var(--ok)}#tip .dn{color:var(--bad)}
#tip .tot{border-bottom:0;border-top:1px solid var(--rim);margin-top:4px;padding-top:4px;font-family:var(--font-heading);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-heading)}
.meter.disc .fill{background:linear-gradient(90deg,#8a2d22,#f06a4a)}
.meter .lbl{font-family:var(--font-heading);font-weight:700;font-size:var(--fs-12);letter-spacing:var(--ls-heading);text-transform:uppercase;color:var(--frost-dim)}
.meter svg{width:22px;height:22px;flex:none}
.meter .bar{box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
#resbox{display:flex;flex-direction:column;max-width:100%}
#popline{font-family:var(--mono);font-size:var(--fs-12);color:var(--frost-dim);display:flex;gap:4px 12px;flex-wrap:wrap;padding:3px 10px 4px;border-top:1px solid rgba(176,138,78,.25)}
#popline b{color:var(--frost);font-weight:400}
#bar{display:flex;gap:4px;padding:5px;max-width:100%;overflow-x:auto}
#bar button{min-width:84px;height:40px;padding:0 12px;background:linear-gradient(180deg,#2c343c,#1a2026);border:1px solid #0a0d10;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -2px 0 rgba(0,0,0,.35);border-radius:1px;font-family:var(--font-heading);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-heading);font-size:var(--fs-12);white-space:nowrap}
#bar button:hover{border-color:var(--amber);color:#ffd9a0}
#bar button.on{border-color:var(--amber);color:var(--amber)}
#bar .sep{width:1px;background:var(--rim);margin:0 4px}
#bar button.major{color:var(--amber)}
#bar button.major.on[data-alarm]{background:#8a2d22;color:#fff;border-color:#e06450}
#bar button.alert{border-color:#e06450!important;box-shadow:inset 0 0 0 1px #e06450,0 0 10px -2px #e06450}
@media (prefers-reduced-motion:no-preference){#bar button.alert{animation:alertp 1.6s ease-in-out infinite}}
@keyframes alertp{50%{box-shadow:inset 0 0 0 1px #e06450,0 0 16px 0 #e06450}}
#bar button.pbar{background:linear-gradient(90deg,rgba(127,196,138,.55) var(--p),rgba(0,0,0,0) var(--p)),linear-gradient(180deg,#2c343c,#1a2026);color:#ffe2b0;text-shadow:0 1px 2px rgba(0,0,0,.8)}
#cards{display:flex;gap:6px;padding:6px;max-width:100%;overflow-x:auto}
.card{width:154px;flex:none;padding:8px 9px 8px 12px;background:linear-gradient(180deg,#252c33,#181d22);border:1px solid #0a0d10;border-left:3px solid #6b5432;border-radius:1px;text-align:left;display:flex;flex-direction:column;gap:3px}
.card:hover:not([disabled]){border-color:var(--amber)}
.card[disabled]{opacity:.45;cursor:not-allowed}
.card .n{font-family:var(--font-heading);font-weight:700;font-size:var(--fs-13);letter-spacing:var(--ls-heading);text-transform:uppercase}
.card .c{font-family:var(--mono);font-size:var(--fs-12);color:var(--amber)}
.card .t{font-size:var(--fs-12);color:var(--frost-dim);line-height:1.3}

/* side info */
#info{right:max(10px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));width:290px;max-width:calc(100vw - 20px);max-height:calc(100% - 230px);overflow-y:auto;padding:12px}
#info h3{margin:0 0 4px;font-family:var(--font-heading);font-weight:700;letter-spacing:var(--ls-heading);text-transform:uppercase;font-size:var(--fs-16)}
#info .sub{color:var(--frost-dim);font-size:var(--fs-12);margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.07);font-size:var(--fs-13)}
.row span:last-child{font-family:var(--mono);text-align:right}
.ctrl{display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap}
.btn{padding:5px 10px;background:linear-gradient(180deg,#2c343c,#1a2026);border:1px solid #0a0d10;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);border-radius:1px;font-size:var(--fs-12);font-family:var(--font-heading);font-weight:700;letter-spacing:var(--ls-heading);text-transform:uppercase}
.btn:hover:not([disabled]){border-color:var(--amber)}
.btn.primary{background:linear-gradient(180deg,#f6b452,#c97f22);color:#1b1206;border-color:#7a4a12;text-shadow:0 1px 0 rgba(255,255,255,.25)}
.btn.danger{border-color:#6a2a22;color:#f3a090}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.pm{width:28px;height:28px;padding:0;font-family:var(--mono);font-size:var(--fs-16)}
.wrow .wn small{display:block;font-size:var(--fs-12);color:var(--frost-dim);line-height:1.1}
.wrow .btn:not(.pm){padding:3px 6px;font-size:var(--fs-12)}
.wrow{display:grid;grid-template-columns:minmax(64px,1fr) 26px 24px 26px auto auto;gap:6px;align-items:center;margin:4px 0}
.wrow .num{text-align:center}
.wrow .wn{font-size:var(--fs-13)}
.closex{position:absolute;right:8px;top:6px;background:none;border:0;color:var(--frost-dim);font-size:var(--fs-20)}
.lvl0{color:#b8d8ff}.lvl1{color:#8ec0ea}.lvl2{color:#9fb3c4}.lvl3{color:#e8c25a}.lvl4{color:#f2a33a}

/* toasts / log */
#needs{left:max(10px,env(safe-area-inset-left,0px));top:calc(64px + env(safe-area-inset-top,0px));width:310px;max-width:calc(100vw - 20px);padding:8px 10px;display:flex;flex-direction:column;gap:6px;max-height:calc(100% - 250px);overflow:auto}
.need{display:flex;gap:8px;align-items:flex-start;padding:4px 6px 4px 4px;border-left:3px solid #7fc48a;background:rgba(0,0,0,.18)}
.need.warn{border-left-color:#e8c25a}.need.bad{border-left-color:#e06450;background:rgba(224,100,80,.12)}
.need svg{width:20px;height:20px;flex:none;margin-top:1px}
.need .nm{font-family:var(--font-heading);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-heading);font-size:var(--fs-12);display:flex;justify-content:space-between;gap:8px}
.need .nm b{font-family:var(--mono);font-weight:400;text-transform:none;letter-spacing:0;color:var(--frost)}
.need.bad .nm b{color:#ff9a86}
.need .nh{font-size:var(--fs-12);color:var(--frost-dim);line-height:1.3}
.needhead{display:flex;justify-content:space-between;align-items:center}
.pic{width:44px;height:44px;flex:none;padding:6px;background:radial-gradient(circle at 50% 35%,#2b3239,#0e1215);box-shadow:inset 0 0 0 1px rgba(176,138,78,.4);border-radius:2px}
.tech.withpic{flex-direction:row;gap:10px;align-items:flex-start}
.tech.withpic .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.tech .st{font-family:var(--mono);font-size:var(--fs-12);color:var(--frost-dim)}
.ally{padding:12px;margin:8px 0}
.slots{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.slot{display:grid;grid-template-columns:22px 1fr auto auto auto;gap:6px;align-items:center;padding:4px 6px;background:rgba(0,0,0,.2)}
.slot .sm{font-size:var(--fs-12);color:var(--frost-dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scales{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:4px 0 16px}
.scale .sh{display:flex;justify-content:space-between;font-family:var(--font-heading);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-heading);font-size:var(--fs-13)}
.scale .sb{display:flex;gap:3px;margin:5px 0 3px;align-items:center}
.scale .sb i{flex:1;height:9px;background:#0d1217;box-shadow:inset 0 0 0 1px #2a333c}
.scale .sb b{width:16px;height:16px;transform:rotate(45deg);border:2px solid;margin-left:5px}
.laws5{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.tech.cap{box-shadow:inset 0 0 0 1px var(--capc),0 0 14px -4px var(--capc);background:linear-gradient(180deg,#2a2024,#181418)}
.tech.cap .n{color:var(--capc)}
select{background:#0d1217;border:1px solid var(--rim);color:var(--frost);padding:6px;border-radius:2px;font:inherit}
#toasts{left:max(10px,env(safe-area-inset-left,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));top:auto;flex-direction:column-reverse;display:flex;flex-direction:column;gap:4px;width:300px;max-width:calc(100vw - 20px)}
.toast{padding:7px 10px;font-size:var(--fs-12);border-left:3px solid var(--amber);background:rgba(20,26,33,.92);animation:tin .25s ease-out}
.toast.bad{border-left-color:var(--bad)}.toast.good{border-left-color:var(--ok)}.toast.cold{border-left-color:var(--cold)}
@keyframes tin{from{transform:translateX(-12px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(5,7,10,.78);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{position:relative;width:min(1100px,100%);max-height:100%;overflow:auto;padding:18px 20px}
.sheet h2{margin:0 0 4px;font-family:var(--font-heading);font-weight:700;font-size:var(--fs-28);letter-spacing:var(--ls-heading);text-transform:uppercase;text-wrap:balance}
.sheet .lead{color:var(--frost-dim);margin:0 0 14px;max-width:70ch}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.tech{padding:9px 10px;border:1px solid #0a0d10;border-left:3px solid #4a5560;background:linear-gradient(180deg,#232a31,#181d22);border-radius:1px;display:flex;flex-direction:column;gap:4px;text-align:left}
.tech.done{background:linear-gradient(180deg,#1c2a20,#141d17);box-shadow:inset 0 0 0 1px rgba(127,196,138,.35)}
.tech.active{border-left-color:var(--amber);box-shadow:inset 0 0 0 1px rgba(242,163,58,.4)}
.tech[disabled]{opacity:.5}
.tech .n{font-family:var(--font-heading);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-heading)}
.tech .d{font-size:var(--fs-12);color:var(--frost-dim)}
.tech .c{font-family:var(--mono);font-size:var(--fs-12);color:var(--amber)}
.col h4{margin:0 0 6px;font-family:var(--font-heading);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-size:var(--fs-13)}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.prog{height:6px;background:#0d1217;border:1px solid var(--rim)}
.prog i{display:block;height:100%;background:var(--amber)}
.event .sheet{width:min(620px,100%);overflow:visible;max-height:none}
.event{overflow:auto}
#needs,#cards,#bar,#info{overflow-x:hidden}
#cards,#bar{overflow-x:auto;scrollbar-width:thin}
.event p{white-space:pre-line;max-width:65ch}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.choices button{text-align:left;padding:10px 12px;background:var(--steel);border:1px solid var(--rim);border-radius:2px}
.choices button:hover:not([disabled]){border-color:var(--amber)}
.choices button small{display:block;color:var(--frost-dim);margin-top:2px}

/* map */
#mapwrap{position:fixed;inset:0;z-index:15;background:#06090c}
#mapc{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#mapside{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));width:300px;max-width:calc(100vw - 20px);max-height:calc(100% - 20px);overflow:auto;padding:12px}
#maptop{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));padding:10px 12px;width:min(560px,calc(100vw - 340px))}
.team{padding:6px 8px;border:1px solid var(--rim);margin:4px 0;border-radius:2px;background:var(--steel);text-align:left;width:100%}
.team.sel{border-color:var(--amber)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:var(--fs-12);color:var(--frost-dim);margin-top:6px}
.legend i{display:inline-block;width:14px;height:4px;vertical-align:middle;margin-right:4px}

/* menu */
#menu .sheet{width:min(760px,100%)}
.logo{font-family:var(--font-heading);font-weight:700;font-size:clamp(34px,7vw,64px);line-height:1;letter-spacing:var(--ls-heading);text-transform:uppercase;margin:0;color:var(--frost);text-shadow:0 0 30px rgba(242,163,58,.25)}
.logo span{color:var(--amber)}
.logo::after{content:"";display:block;height:2px;margin-top:10px;background:linear-gradient(90deg,var(--amber),rgba(176,138,78,.2) 60%,transparent)}
.overlay.menubg{background:radial-gradient(ellipse at center,rgba(6,9,13,.45),rgba(4,6,9,.85)),url('map_bg.jpg') center/cover no-repeat,#0b0e12;flex-direction:column}
#msnow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.overlay.menubg>*:not(#msnow){position:relative;z-index:1}
.mlang{position:fixed!important;top:calc(12px + env(safe-area-inset-top,0px));right:14px;display:flex;border:1px solid var(--rim);border-radius:2px;overflow:hidden}

.mcol{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}.msub{color:var(--frost-dim);margin:4px 0 18px}
.mbtns{display:flex;flex-direction:column;gap:8px;width:min(300px,80vw)}.btn.big{padding:12px 16px;font-size:var(--fs-14);letter-spacing:var(--ls-heading)}
.mwide{width:min(900px,100%)}.mback{margin-bottom:8px}.diffs.four{grid-template-columns:repeat(4,1fr)}@media (max-width:700px){.diffs.four{grid-template-columns:1fr 1fr}}
.diff small.dnum{display:block;margin-top:6px;color:var(--amber);font-family:var(--mono);font-size:var(--fs-12);line-height:1.35}
.mods{display:flex;flex-direction:column;gap:6px;margin:10px 0 14px}.mods small{color:var(--frost-dim)}
.btn.huge{width:100%;padding:14px;font-size:var(--fs-20);letter-spacing:.1em}.hudvol{display:flex;align-items:center;gap:4px;font-size:var(--fs-13)}.hudvol input{width:80px;accent-color:var(--amber)}
.vol{display:flex;align-items:center;gap:12px;margin:6px 0;color:var(--frost-dim)}.vol input{flex:1;max-width:320px;accent-color:var(--amber)}
.ctl{margin:6px 0 0 18px;color:var(--frost-dim);line-height:1.7}
.diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.diff{padding:10px;border:1px solid var(--rim);background:var(--steel);text-align:left;border-radius:2px}
.diff.on{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.diff b{display:block;font-family:var(--font-heading);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-heading);font-weight:500}
.diff small{color:var(--frost-dim)}
.menurow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
input[type=text]{background:#0d1217;border:1px solid var(--rim);color:var(--frost);padding:7px 9px;border-radius:2px;font-family:var(--mono);text-transform:uppercase;width:120px}
label.chk{display:flex;gap:8px;align-items:center;font-size:var(--fs-13)}
.coopbadge{padding:4px 8px;font-family:var(--mono);font-size:var(--fs-12);color:var(--amber)}

@media (max-width:640px){

}

const WEATHER=[-10,-10,-30,-30,-30,-30,-30,-30,-30,-10,-10,-30,-30,-30,-30,-40,-40];
const W_SEGS=[[-50,2],[-40,7],[-50,3],[-40,1],[-50,7],[-40,1],[-60,7],[-40,1],[-70,7],[-50,1],[-80,7],[-60,1],[-90,7],[-70,1],[-100,7],[-80,1],[-110,7],[-90,1]];
function weatherAt(d){if(d<1)d=1;if(d<=WEATHER.length)return WEATHER[d-1];let k=d-WEATHER.length;for(const [t,n] of W_SEGS){if(k<=n)return t;k-=n;}k=(k-1)%8;return k<7?-120:-100;}
function wTier(s){const w=weatherAt(s.day);return w<=-40?2:w<=-30?1:0;}
function insNeed(s){const w=weatherAt(s.day);return Math.max(1,Math.ceil((-w-30)/10));} // −40 → 1 утепление, −50 → 2 … −120 → 9
function medposts(s){return s.bld.filter(b=>(b.type==='medpost'||b.type==='hospital')&&!b.build&&b.on&&workforce(b.a)>0).length;}

function buildGraph(){
  const nodes={},adj={},lines={};
  const node=(name,x,y,line,secret)=>{
    if(!nodes[name])nodes[name]={id:name,x,y,lines:[],secret:!!secret};
    else if(x!=null&&nodes[name].x==null){nodes[name].x=x;nodes[name].y=y;}
    if(!nodes[name].lines.includes(line))nodes[name].lines.push(line);
    adj[name]=adj[name]||[];return nodes[name];
  };
  const link=(a,b,kind)=>{
    if(a===b||adj[a].some(e=>e.to===b))return;
    const d=Math.hypot(nodes[a].x-nodes[b].x,nodes[a].y-nodes[b].y);
    const len=kind==='tr'?Math.max(12,d*.6):d;
    adj[a].push({to:b,len,kind});adj[b].push({to:a,len,kind});
  };
  for(const L of LINES){
    let pts;
    if(L.circle){
      const {cx,cy,rx,ry,a0}=L.circle;
      pts=L.st.map((n,i)=>{const a=(a0+i*360/L.st.length)*Math.PI/180;return{n,x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)};});
    }else{
      pts=L.st.map(s=>{const [n,xy]=s.split('@');if(xy){const [x,y]=xy.split(',').map(Number);return{n,x,y,f:1};}return{n};});
      for(let i=0;i<pts.length;i++){
        if(pts[i].f)continue;
        let a=i-1;while(!pts[a].f)a--;let b=i+1;while(!pts[b].f)b++;
        const t=(i-a)/(b-a);pts[i].x=pts[a].x+(pts[b].x-pts[a].x)*t;pts[i].y=pts[a].y+(pts[b].y-pts[a].y)*t;
      }
    }
    lines[L.id]=pts.map(p=>p.n);
    for(const p of pts)node(p.n,p.x,p.y,L.id,L.secret);
    for(let i=1;i<pts.length;i++)link(pts[i-1].n,pts[i].n,'t');
    if(L.ring)link(pts[pts.length-1].n,pts[0].n,'t');
  }
  // пересадки: близкие станции разных линий
  const ids=Object.keys(nodes);
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
    const a=nodes[ids[i]],b=nodes[ids[j]];
    if(a.secret||b.secret)continue;
    if(a.lines.some(l=>b.lines.includes(l)))continue;
    if(Math.hypot(a.x-b.x,a.y-b.y)<56)link(a.id,b.id,'tr');
  }
  link('Охотный Ряд','Театральная','tr');
  for(const [a,b] of SECRET_LINKS)link(a,b,'secret');
  return{nodes,adj,lines};
}

function translit(s){return s.replace(/[А-Яа-яЁё]/g,c=>{const l=c.toLowerCase(),t=TL[l]??c;return c===l?t:t.charAt(0).toUpperCase()+t.slice(1);}).replace(/ыy/g,'y').replace(/iy\b/g,'y');}
let TR_MAP=null,TR_RE=null;
function buildTR(){
  TR_MAP=new Map();for(const [r,e] of EN)TR_MAP.set(r,e);
  for(const id in G.nodes)if(!TR_MAP.has(id))TR_MAP.set(id,translit(id));
  const L='А-Яа-яЁё';
  const keys=[...TR_MAP.keys()].sort((a,b)=>b.length-a.length).map(k=>{const e=k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return (CYR.test(k[0])?'(?<!['+L+'])':'')+e+(CYR.test(k[k.length-1])?'(?!['+L+'])':'');});

}
const CYR=/[А-Яа-яЁё]/;
function tr(str){if(LANG!=='en'||str==null)return str;str=String(str);if(!CYR.test(str))return str;if(!TR_RE)buildTR();return str.replace(TR_RE,m=>TR_MAP.get(m)??m);}

}

  {const P=80*D.cons;s.res.food=Math.max(s.res.food,Math.ceil(2.5*P));s.res.water=Math.max(s.res.water,Math.ceil(2.2*P));s.res.wood=Math.max(s.res.wood,160);s.res.stone=Math.max(s.res.stone,70);s.res.steel=Math.max(s.res.steel,25);} // хотя бы сутки на раскачку на любой сложности
  // сетка: пути вдоль краёв, завалы
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){

const tile=(s,x,y)=>s.grid[y*GW+x];

const LVL_N=['Лютый мороз','Очень холодно','Холодно','Прохладно','Комфортно'];

// Очаг: сначала костёр (мощность 1), на него ставят печь и улучшают её (ур. 1–3).
const STOVE_COST=[{wood:15,steel:10},{steel:25,wood:15},{steel:40,cores:1}],STOVE_REQ=[null,'t_power1','t_power2'];
function stoveLvl(s){return s.gen.stove==null?Math.max(1,Math.min(3,genMaxOld(s)-1)):s.gen.stove;}
function genMaxOld(s){return has(s,'t_power2')?4:has(s,'t_power1')?3:2;}

function fireName(s){const k=stoveLvl(s);return k?`Печь, ур. ${k}`:'Костёр';}
function genRadius(s){return (stoveLvl(s)?3:2)+(has(s,'t_radius1')?2:0)+(has(s,'t_radius2')?2:0);}
function genHeat(s){if(!s.gen.on)return 0;return s.gen.lvl*10+(s.gen.over?10:0);}
function computeHeat(s){
  const amb=ambient(s),R=genRadius(s),gh=genHeat(s);
  const heaters=s.bld.filter(b=>b.type==='heater'&&!b.build&&b.on&&b.fuelOk!==false);
  s.heat=new Array(GW*GH);
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    let d=amb;
    if(Math.hypot(x-GX,y-GY)<=R+.3)d+=gh;
    for(const h of heaters)if(Math.hypot(x-h.x,y-h.y)<=(has(s,'t_heatpipes')?3.3:2.3))d+=10*lvlMul(h);
    const t=tile(s,x,y);
    if(t.b>0){const b=bById(s,t.b);d+=(B[b.type].ins||5)+(has(s,'t_insul')?10:0)+(b.ins||0)*(has(s,'t_coldmat')?8:5);}

  }

const heatAt=(s,x,y)=>s.heat?s.heat[y*GW+x]:ambient(s);

// строители: сначала свободные рабочие, затем снимаем с завалов и второстепенных зданий; после стройки возвращаем на место
function takeBuilders(s,b,need){
  let got=Math.min(need,Math.max(0,free(s,'w')));need-=got;b.bfrom=b.bfrom||[];
  if(need>0){const J=jobsOf(s).filter(j=>j.o.a.w>0&&!(j.d&&(j.d.kitchen||j.d.beds||(j.d.prod&&j.d.prod.raw)||j.d.heat))).sort((a,c)=>(c.pile?1:0)-(a.pile?1:0));
    for(const j of J){if(need<=0)break;const k=Math.min(need,j.o.a.w);j.o.a.w-=k;need-=k;got+=k;b.bfrom.push({key:j.pile?'p'+s.grid.findIndex(g=>g.pile===j.o):'b'+j.o.id,n:k});}}
  b.bw=(b.bw||0)+got;return got;}
function releaseBuilders(s,b){
  for(const q of b.bfrom||[]){let o=null,max=0;if(q.key[0]==='b'){const x=bById(s,+q.key.slice(1));if(x){o=x.a;max=B[x.type].jobs;}}else{const t=s.grid[+q.key.slice(1)];if(t&&t.pile){o=t.pile.a;max=t.pile.max||5;}}
    if(o){const room=max-(o.w+o.e+o.c);o.w+=Math.max(0,Math.min(q.n,room));}}
  b.bfrom=[];b.bw=0;}
function jobsOf(s){
  const L=[];
  for(const b of s.bld){const d=B[b.type];if(d.job&&!b.build)L.push({o:b,d,job:d.job,max:d.jobs,safe:!!d.safe});}
  for(let i=0;i<s.grid.length;i++){const t=s.grid[i];if(t.pile)L.push({o:t.pile,job:'w',max:t.pile.max||5,safe:!t.pile.clear,pile:1});}
  return L;
}
function assigned(s,t){let n=0;for(const j of jobsOf(s))n+=j.o.a[t];if(t==='w')for(const b of s.bld)n+=(b.crew||0)+(b.build>0?(b.bw||0):0);return n;}
function free(s,t){return healthy(s,t)-assigned(s,t);}
function addWorker(s,j){
  const a=j.o.a,tot=a.w+a.e+a.c;if(tot>=j.max)return false;
  if(j.job==='e'){if(free(s,'e')>0){a.e++;return true;}return false;}
  if(free(s,'w')>0){a.w++;return true;}

  if(free(s,'e')>0){a.e++;return true;}

}
function canTake(s,j,t){if(j.job==='e')return t==='e';if(t==='c')return has(s,'child_labor')&&j.safe;return true;}
function remWorker(j){const a=j.o.a;if(a.c>0)a.c--;else if(a.e>0&&j.job==='w')a.e--;else if(a.w>0)a.w--;else if(a.e>0)a.e--;}

  const J=jobsOf(s).reverse();

    for(const j of J){while(over>0&&j.o.a[t]>0){j.o.a[t]--;over--;}}

function workforce(a){return a.w+a.e+a.c*.5;}
function housing(s){let n=0;for(const b of s.bld)if(B[b.type].house&&!b.build)n+=capOf(s,b);return n;}

   ${rows.map(m=>`<div class="trow"><span>${esc(m.n)}</span><b class="${good(m[key])?'up':'dn'}">${fmtv(m[key]*mul)}</b></div>`).join('')||'<div class="hint">Нет постоянных причин.</div>'}
   <div class="trow tot"><span>Итого за сутки</span><b class="${good(tot)?'up':'dn'}">${fmtv(tot)}</b></div>
   <div class="hint">${kind==='hope'?'Смерти, события, обещания и законы меняют надежду сразу.':`Множитель сложности ×${D.disc}${has(s,'o_new')?', «Новый порядок» ×0,5':''}. События и законы меняют недовольство сразу.`}</div>`;
}
function checkEnd(s){
  if(s.over)return;
  if(popTotal(s)<=0){s.over='dead';s.queue.unshift({id:'gameover',p:{why:'dead'}});return;}
  if(s.oneDeath&&s.deaths>0){s.over='death1';s.queue.unshift({id:'gameover',p:{why:'death1'}});return;}
  if(s.disc>=100){s.over='disc';s.queue.unshift({id:'gameover',p:{why:'disc'}});return;}
  if(s.hope<=0){s.over='hope';s.queue.unshift({id:'gameover',p:{why:'hope'}});return;}
  if(s.disc>=85&&!s.flags.ult){s.flags.ult=1;s.queue.push({id:'ultimatum'});}
  if(s.disc<70)s.flags.ult=0;
  if(s.hope<=15&&!s.flags.hopew){s.flags.hopew=1;s.queue.push({id:'despair'});}
  if(s.hope>30)s.flags.hopew=0;
}

function storyEvents(s){
  const d=s.day;
  if(d===2)s.queue.push({id:'cold_tents'});
  if(d===3&&!has(s,'child_labor')&&!has(s,'child_shelter'))s.queue.push({id:'children'});
  if(d===4)newPromise(s);
  if(d===5)s.queue.push({id:'purpose'});
  if(d===7)s.queue.push({id:'refugees'});
  if(d===9)newPromise(s);
  if(d===10)s.queue.push({id:'leavers'});
  if(d===13&&!s.flags.metro2)s.queue.push({id:'rumor_m2'});
  if(d===15)newPromise(s);
  if(d===15&&s.leavers>0)s.queue.push({id:'leavers_end'});
  if(d===20)s.queue.push({id:'storm_warn'});
  if(d===25)s.queue.push({id:'storm'});
  if(d===22||d===12||d===18)newPromise(s);
}
const pick=a=>a[Math.floor(rnd()*a.length)];
const PROMISES=[
  {k:'medpost',t:'Постройте медпункт',ok:s=>s.bld.some(b=>(b.type==='medpost'||b.type==='hospital')&&!b.build)},
  {k:'heat',t:'Согрейте жильё: никто не спит в мороз',ok:s=>{const h=homesHeat(s);return h.per[0]+h.per[1]===0&&h.homeless===0;}},
  {k:'food',t:'Запасите 150 пайков',ok:s=>s.res.food>=150},
  {k:'sick',t:'Не больше 5 больных',ok:s=>s.ill.w+s.ill.e+s.ill.c+s.crit.w+s.crit.e+s.crit.c<=5},
  {k:'homes',t:'Крыша над головой для каждого',ok:s=>housing(s)>=popTotal(s)},
];
function newPromise(s){
  if(s.promise)return;
  const opts=PROMISES.filter(p=>!p.ok(s));if(!opts.length)return;
  const p=pick(opts);s.queue.push({id:'promise',p:{k:p.k}});
}
function checkPromise(s){
  const P=PROMISES.find(p=>p.k===s.promise.k);
  if(P.ok(s)){s.hope+=10;s.disc-=6;toast(s,`Обещание выполнено: ${P.t}`,'good');log(s,`Обещание выполнено: ${P.t}.`,'good');s.promise=null;return;}
  if(s.promise.left<=0){s.hope-=12;s.disc+=10;toast(s,`Обещание не выполнено: ${P.t}`,'bad');log(s,`Обещание нарушено: ${P.t}.`,'bad');s.promise=null;}
}

function revealMetro2(s){
  if(s.flags.metro2)return;s.flags.metro2=1;
  for(const id in G.nodes)if(G.nodes[id].secret&&!s.st[id])s.st[id]={k:1};
  log(s,'Найден вход в Метро-2.','good');
}

/* ---------------------------- РАЗВЕДКА ---------------------------- */
function teamSlots(s){const d=s.bld.filter(b=>b.type==='depot'&&!b.build).length;return d*(has(s,'t_teams')?2:1);}
function syncTeams(s){while(s.teams.length<teamSlots(s)){const n=s.teams.length+1;s.teams.push({id:n,at:HUB,path:[],prog:0,cargo:{},rest:0,explore:0});}}
function passable(s,id){return s.st[id]&&(s.st[id].k>=1||G.nodes[id].secret&&s.flags.metro2);}
function findPath(s,from,to){
  // Дейкстра по известным станциям (неизвестные можно проходить, если цель видна)
  const dist={[from]:0},prev={},q=[from],done=new Set();
  while(q.length){
    q.sort((a,b)=>dist[a]-dist[b]);const u=q.shift();if(done.has(u))continue;done.add(u);if(u===to)break;
    for(const e of G.adj[u]){
      if(e.kind==='secret'&&!s.flags.metro2)continue;
      if(!s.st[e.to])continue;
      if(s.st[e.to].k===0&&e.to!==to&&s.st[u].k<2)continue;
      const nd=dist[u]+e.len;if(dist[e.to]==null||nd<dist[e.to]){dist[e.to]=nd;prev[e.to]=u;q.push(e.to);}
    }
  }
  if(dist[to]==null)return null;
  const p=[to];let c=to;while(c!==from){c=prev[c];p.unshift(c);}return p;
}
function edgeLen(a,b){const e=G.adj[a].find(e=>e.to===b);return e?e.len:Math.hypot(G.nodes[a].x-G.nodes[b].x,G.nodes[a].y-G.nodes[b].y);}
function teamSpeed(s){return (has(s,'t_draisine')?60:38)*(has(s,'expedition')?1.3:1);}
function moveTeams(s){
  if(sleepHour(s))return; // ночью отряды ставят лагерь и спят
  for(const tm of s.teams){
    if(tm.rest>0){tm.rest--;continue;}
    if(tm.explore>0){tm.explore--;if(!tm.explore)arrive(s,tm,tm.at,true);continue;}
    if(tm.path.length<2)continue;
    let budget=teamSpeed(s);
    while(budget>0&&tm.path.length>=2){
      const L=edgeLen(tm.path[0],tm.path[1]);const need=(1-tm.prog)*L;
      if(budget>=need){budget-=need;tm.prog=0;tm.path.shift();tm.at=tm.path[0];
        if(arrive(s,tm,tm.at,false))break;}
      else{tm.prog+=budget/L;budget=0;}
    }
    if(tm.path.length<2)tm.path=[];
  }
  for(const g of s.groups){
    let budget=26;
    while(budget>0&&g.path.length>=2){const L=edgeLen(g.path[0],g.path[1]);const need=(1-g.prog)*L;
      if(budget>=need){budget-=need;g.prog=0;g.path.shift();}else{g.prog+=budget/L;budget=0;}}
    if(g.path.length<2){addPeople(s,g.n,g.sick);s.hope+=2;toast(s,`На станцию пришли ${g.n} выживших`,'good');log(s,`Пришли ${g.n} выживших.`,'good');ev(s,'good',`Пришли ${g.n} выживших`,FIRE_AT);g.done=1;}
  }
  s.groups=s.groups.filter(g=>!g.done);
}
function addCargo(s,team,k,n){const tm=s.teams.find(t=>t.id===team);if(tm)tm.cargo[k]=(tm.cargo[k]||0)+n;}
function arrive(s,tm,id,explored){
  if(id===HUB){
    let got=[];for(const k in tm.cargo){if(tm.cargo[k]>0){s.res[k]+=tm.cargo[k];got.push(`${fmt(tm.cargo[k])} ${RES[k].n.toLowerCase()}`);}}
    tm.cargo={};if(got.length)toast(s,`Отряд ${tm.id} привёз: ${got.join(', ')}`,'good');
    return false;
  }
  const st=s.st[id];
  if(st.k<2&&!explored){tm.explore=2;return true;} // остановка на разведку
  if(st.k<2){
    st.k=2;
    for(const e of G.adj[id]){if(e.kind==='secret'&&!s.flags.metro2)continue;if(s.st[e.to])s.st[e.to].k=Math.max(1,s.st[e.to].k);}
    explore(s,tm,id);
    return true;
  }
  return false;
}

    case 'metro2':s.queue.push({id:'st_metro2',p:{txt:c.txt}});return;

function bMult(s,b,k){
  let m=1;
  if(b.type==='farm'&&has(s,'t_farm2'))m*=1.5;
  if(b.type==='condenser'&&has(s,'t_filter'))m*=1.5;
  if(['sawmill','scrapyard','coalmine'].includes(b.type))m*=(has(s,'t_tools')?1.2:1)*(has(s,'recycling')?1.1:1);
  if(b.type==='coalmine'&&has(s,'t_drills'))m*=1.25;
  return m;
}
function bEff(s,b){const d=B[b.type];const lv=lvlOf(heatAt(s,b.x,b.y));let eff=HEAT_EFF[lv];if(d.needHeat&&lv<d.needHeat&&!has(s,'t_seedbank'))eff*=.4;return eff*lvlMul(b)*capMul(s,b);}
const workHoursPerDay=s=>has(s,'ext_shift')?14:10;
const rationMult=s=>has(s,'additives')?3:has(s,'soup')?2.5:2;
const foodPerPerson=s=>D_(s).cons*(has(s,'communal')?.85:has(s,'private')?1.1:1)*(has(s,'food_ration')?.8:1);
const waterPerPerson=s=>D_(s).cons*(has(s,'water_ration')?.7:1);
function dayRates(s){
  const H=workHoursPerDay(s),out={coal:0,wood:0,steel:0,raw:0,food:0,water:0,meds:0,cores:0,rp:0},per={};let kcap=0;
  for(const b of s.bld){const d=B[b.type];if(b.build||!d.job)continue;const o={};per[b.id]=o;
    const wf=b.on?workforce(b.a):0;if(wf<=0){o.idle=1;continue;}
    const eff=bEff(s,b),h=b.emerg>0?24:H;
    if(d.prod)for(const k in d.prod){const m=d.prod[k]*wf*eff*h*bMult(s,b,k);o[k]=m;out[k]+=m;}
    if(d.kitchen){const c=7.5*wf*eff*h*(has(s,'t_cook2')?1.5:1);o.kcap=c;kcap+=c;}
    if(d.rp){const SI=sciInfo(s);const r=SI.W.includes(b)?SI.perH*H/SI.W.length:0;o.rp=r;out.rp+=r;}}
  for(const b of s.bld){if(b.type!=='gather'||b.build||!b.on)continue;const wf=workforce(b.a)*bEff(s,b);const P=gatherPiles(s,b);if(!wf||!P.length)continue;for(const t of P)out[t.pile.r]+=Math.min(t.pile.amt,wf*H*(has(s,'t_gather')?1.25:1)/P.length);}
  for(const t of s.grid)if(t.pile&&!(t.pile.clear>0)){const wf=workforce(t.pile.a);out[t.pile.r]+=Math.min(t.pile.amt,wf*H*(has(s,'t_gather')?1.25:1)*(has(s,'t_drills')?1.25:1));}
  for(const o of s.outposts){const g=({coal:40,wood:30,steel:15,raw:25,water:30,meds:25}[o.t]||15)*(has(s,'t_logistics')?1.5:1);if(o.t==='mixed'){out.coal+=g;out.wood+=g;}else out[o.t==='meds'?'raw':o.t==='water'?'coal':o.t]+=g;}
  const cooked=Math.min(kcap,out.raw+s.res.raw);out.food+=cooked*rationMult(s);out.rawCooked=cooked;
  const n=popTotal(s);
  const fuel=s.gen.on?[0,3,5,8,12][s.gen.lvl]*(s.gen.over?1.5:1)*D_(s).cons:0;
  const heaters=s.bld.filter(b=>b.type==='heater'&&!b.build&&b.on).length;
  const need={food:n*foodPerPerson(s),water:n*waterPerPerson(s),coal:(fuel+heaters)*24,raw:cooked};
  return{out,need,per,kcap,fuelH:fuel+heaters};
}
// жильцы по домам (самые тёплые заполняются первыми)
function occupancy(s){
  const homes=s.bld.filter(b=>B[b.type].house&&!b.build).map(b=>({b,cap:capOf(s,b),lv:lvlOf(heatAt(s,b.x,b.y))})).sort((a,b)=>b.lv-a.lv);
  let left=popTotal(s);const m={};for(const h of homes){const k=Math.min(left,h.cap);m[h.b.id]=k;left-=k;}return m;
}

function gatherPiles(s,b){const R=gatherR(s),out=[];for(let i=0;i<s.grid.length;i++){const t=s.grid[i];if(!t.pile||t.pile.clear>0)continue;const x=i%GW,y=Math.floor(i/GW);if(Math.hypot(x-b.x,y-b.y)<=R)out.push(t);}return out;}
function bLabel(s,b,R,occ){

  const o=R.per[b.id];if(!o)return null;if(o.idle)return{t:'Нет работников',k:'bad',ic:'idle'};
  if(d.kitchen&&s.res.raw<1&&workforce(b.a)>0)return{t:'Простой: нет сырья',k:'bad',ic:'res'};
  if(o.raw!=null){const ppl=o.raw*rationMult(s)/foodPerPerson(s);return{t:`+${Math.round(o.raw)} еды/день · кормит ${Math.floor(ppl)} чел.`,k:'ok'};}
  if(o.water!=null)return{t:`+${Math.round(o.water)} воды/день · поит ${Math.floor(o.water/waterPerPerson(s))} чел.`,k:'ok'};
  if(o.kcap!=null)return{t:`Готовит до ${Math.round(o.kcap*rationMult(s))} пайков/день`,k:'ok'};
  if(o.coal!=null)return{t:`+${Math.round(o.coal)} угля/день · ${Math.round(o.coal/Math.max(1,R.fuelH))} ч огня`,k:'ok'};
  if(o.rp!=null){const T=s.research&&TECHBY[s.research];return{t:`+${Math.round(o.rp)} очков науки/день`+(T?` · ${T.n} ${Math.floor(s.rp/T.rp*100)}%`:' · ничего не изучается'),k:T?'ok':'mute'};}
  for(const k of ['wood','steel','meds','cores'])if(o[k]!=null)return{t:`+${o[k]<1?o[k].toFixed(1):Math.round(o[k])} ${RES[k].n.toLowerCase()}/день`,k:'ok'};
  return null;
}

function needsHTML(s){

  const row=(icon,name,state,main,hint)=>`<div class="need ${state}">${icon}<div><div class="nm">${name}<b>${main}</b></div>${hint?`<div class="nh">${hint}</div>`:''}</div></div>`;

    fGap>0?`Не хватает ${Math.round(fGap)} пайков в день. Запаса на ${(s.res.food/Math.max(1,fNeed)).toFixed(1)} дн. Нужно ещё ≈ ${Math.ceil(fGap/farmDay)} грибн. ферм${R.kcap*rationMult(s)<fNeed?' и кухня':''}.`:`Хватает. Запас ${Math.floor(s.res.food)} пайков.`));

  // жильё
  const cap=housing(s),hl=Math.max(0,n-cap);
  out.push(row(ico('house2','#cfe3f2'),'Жильё',hl?'bad':'ok',`${Math.min(n,cap)} / ${n} под крышей`,hl?`Без крыши ${hl} чел. Нужно ещё ≈ ${Math.ceil(hl/10)} палаток (по 10 мест).`:`Свободных мест: ${cap-n}.`));

    ill+crit>beds?`Не хватает ${ill+crit-beds} коек${crit?`, тяжёлых ${crit} (нужны койки медпункта или лазарет)`:''}.`:crit?`Тяжёлых ${crit}.`:''));

    `Без дела: рабочих ${free(s,'w')}, инженеров ${free(s,'e')}.`));

const ally={on:false,unsub:[],peers:{},status:'',lastPub:0};
async function allyConnect(s){
  allyStop();if(!s||!s.ally)return;
  const db=await coopDb();if(!db){ally.status='Союз недоступен в этом просмотре';return;}
  const {code,me}=s.ally;ally.on=true;ally.status='на связи';
  ally.unsub.push(db.collection('alliance/'+code+'/players').onSnapshot(snap=>{const now=Date.now();const P={};
    snap.docs.forEach(d=>{const x=d.data();if(d.id!==me&&x&&now-x.t<120000)P[d.id]=x;});ally.peers=P;ui.dirty=true;},()=>{ally.status='нет доступа';}));
  ally.unsub.push(db.collection('alliance/'+code+'/raids').onSnapshot(snap=>{
    for(const ch of snap.docChanges()){if(ch.type!=='added')continue;const g=ch.doc.data();if(!g||g.to!==me||ally.seen?.has('r'+ch.doc.id))continue;(ally.seen=ally.seen||new Set()).add('r'+ch.doc.id);onRaid(g,ch.doc.id);db.doc('alliance/'+code+'/raids/'+ch.doc.id).delete().catch(()=>{});}
  },()=>{}));
  ally.unsub.push(db.collection('alliance/'+code+'/gifts').onSnapshot(snap=>{
    for(const ch of snap.docChanges()){if(ch.type!=='added')continue;const g=ch.doc.data();if(!g||g.to!==me||ally.seen?.has(ch.doc.id))continue;
      (ally.seen=ally.seen||new Set()).add(ch.doc.id);
      const n=Math.max(0,Math.min(5000,Math.floor(+g.n||0)));if(g.raid&&S&&!n&&g.lost){toast(S,`Налёт на «${String(g.fromName||'').slice(0,24)}» отбит, налётчики погибли: ${Math.floor(+g.lost)||0}`,'bad');}
      if(RES[g.r]&&n&&S){S.res[g.r]+=n;toast(S,g.raid?`Налётчики вернулись с добычей: ${n} ${RES[g.r].n.toLowerCase()}`:`${String(g.fromName||'Союзник').slice(0,30)} прислал(а): ${n} ${RES[g.r].n.toLowerCase()}`,'good');log(S,`Получено от союзника: ${n} ${RES[g.r].n.toLowerCase()}.`,'good');ui.dirty=true;}
      db.doc('alliance/'+code+'/gifts/'+ch.doc.id).delete().catch(()=>{});}
  },()=>{}));
}
function allyStop(){for(const u of ally.unsub)try{u();}catch(e){}ally.unsub=[];ally.on=false;ally.peers={};}
function allyPublish(){
  if(!ally.on||!S||!S.ally||!coop.db)return;const now=Date.now();if(now-ally.lastPub<10000)return;ally.lastPub=now;
  const r={};for(const k of RES_ORDER)r[k]=Math.floor(S.res[k]);
  coop.db.doc('alliance/'+S.ally.code+'/players/'+S.ally.me).set({name:S.ally.name,day:S.day,pop:popTotal(S),hope:Math.round(S.hope),res:r,t:now}).catch(()=>{ally.status='ошибка связи';});
}
function allySend(to,r,n){
  if(!S||!S.ally||!coop.db||!RES[r])return;n=Math.floor(n);if(n<=0||S.res[r]<n)return;
  S.res[r]-=n;const peer=ally.peers[to];
  coop.db.collection('alliance/'+S.ally.code+'/gifts').add({to,from:S.ally.me,fromName:S.ally.name,r,n,t:Date.now()})
    .then(()=>{toast(S,`Отправлено ${peer?peer.name:'союзнику'}: ${n} ${RES[r].n.toLowerCase()}`,'good');})
    .catch(()=>{S.res[r]+=n;toast(S,'Не удалось отправить, ресурсы вернулись','bad');});
  ui.dirty=true;
}

function menuSnow(){// падающий снег поверх фона меню
  const c=$('msnow');if(!c)return;const x=c.getContext('2d');let W=0,H=0;const P=Array.from({length:160},()=>({x:Math.random(),y:Math.random(),r:.6+Math.random()*2.2,v:.02+Math.random()*.05,w:Math.random()*6}));
  const step=t=>{if(!c.isConnected)return;if(c.width!==innerWidth||c.height!==innerHeight){W=c.width=innerWidth;H=c.height=innerHeight;}x.clearRect(0,0,W,H);x.fillStyle='rgba(225,236,248,.75)';
    for(const p of P){p.y+=p.v*.016;p.x+=Math.sin(t/1500+p.w)*.0004+.0003;if(p.y>1.02){p.y=-.02;p.x=Math.random();}if(p.x>1)p.x-=1;x.beginPath();x.arc(p.x*W,p.y*H,p.r,0,7);x.fill();}requestAnimationFrame(step);};
  requestAnimationFrame(step);
}

async function coopDb(){
  if(coop.db)return coop.db;
  if(!window.claude||!window.claude.use){coop.status='Кооператив работает только на странице claude.ai';return null;}
  try{coop.db=await window.claude.use('db');}catch(e){coop.db=null;}
  if(!coop.db)coop.status='Кооператив недоступен: нужен вход в claude.ai и доступ к странице';
  return coop.db;
}
function coopStop(){for(const u of coop.unsub)try{u();}catch(e){}coop.unsub=[];coop.role='solo';coop.code=null;}
async function coopHost(){
  const db=await coopDb();if(!db){ui.dirty=true;renderMenu();return;}
  coopStop();
  const code=Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[ri(0,31)]).join('');
  if(!S||S.over){S=newGame(ui.diff,ui.survivor);S.oneDeath=ui.oneDeath;}
  coop.role='host';coop.code=code;coop.status='ждём напарника';
  const ref=db.doc('coop/'+code);
  try{await ref.set({s:JSON.stringify(S),t:Date.now()});}catch(e){coop.status='Не удалось создать: '+(e.code||'ошибка');coop.role='solo';renderMenu();return;}
  coop.unsub.push(db.collection('coop/'+code+'/acts').onSnapshot(snap=>{
    for(const ch of snap.docChanges()){if(ch.type!=='added'||coop.seen.has(ch.doc.id))continue;coop.seen.add(ch.doc.id);const d=ch.doc.data();try{const a=JSON.parse(d.a);act(S,a);ui.dirty=true;}catch(e){}
      db.doc('coop/'+code+'/acts/'+ch.doc.id).delete().catch(()=>{});}
  },e=>{coop.status='связь потеряна';}));
  coop.unsub.push(db.collection('coop/'+code+'/players').onSnapshot(snap=>{
    const now=Date.now();let n=0;snap.docs.forEach(d=>{const x=d.data();if(x&&now-x.t<60000)n++;});coop.partners=n;coop.status=n?`напарников: ${n}`:'ждём напарника';
  },()=>{}));
  startGame();
}
async function coopPush(){

async function coopJoin(code){
  code=(code||'').trim().toUpperCase();if(!/^[A-Z0-9]{5}$/.test(code)){coop.status='Введите код из 5 символов';renderMenu();return;}
  const db=await coopDb();if(!db){renderMenu();return;}
  coopStop();coop.role='guest';coop.code=code;coop.status='подключение…';S=null;
  const me='p'+Math.random().toString(36).slice(2,9);
  let got=false;const timer=setTimeout(()=>{if(!got){coop.status='Игра не найдена или нет доступа';ui.dirty=true;if(ui.mode==='menu')renderMenu();}},10000);
  coop.unsub.push(db.doc('coop/'+code).onSnapshot(snap=>{
    const d=snap.data();if(!d||!d.s)return;got=true;clearTimeout(timer);
    try{const ns=JSON.parse(d.s);const oldq=S&&S.queue.length;S=ns;coop.status=Date.now()-d.t>15000?'хост не отвечает':'на связи';ui.dirty=true;if(ui.mode!=='game')startGame(true);}catch(e){}
  },e=>{coop.status='Нет доступа к игре';clearTimeout(timer);if(ui.mode==='menu')renderMenu();}));
  coop.send=a=>{db.collection('coop/'+code+'/acts').add({a:JSON.stringify(a),t:Date.now()}).catch(()=>{coop.status='действие не отправлено';});};
  const beat=()=>db.doc('coop/'+code+'/players/'+me).set({t:Date.now()}).catch(()=>{});
  beat();const iv=setInterval(beat,20000);coop.unsub.push(()=>clearInterval(iv));
  renderMenu();
}

}
const AUD={t:0};
function audioTick(t){// музыка по времени суток и атакам, окружение от позиции камеры, рык подходящих мутантов
  if(!window.GameAudio)return;
  if(ui.mode!=='game'||!S){GameAudio.playState('menu');return;}
  const s=S,att=!!(s.wave||(s.zombies&&s.zombies.length)),night=s.hour>=21||s.hour<6;
  GameAudio.playState(att||night?'night':'day'); // во время атаки — ночной трек
  if(t-AUD.t>150){AUD.t=t;const d=Math.hypot(cam3.tx,cam3.tz)+cam3.d*.35;const sk=stoveLvl(s);
    GameAudio.updateAmbient({distToFire:s.gen.on?d:99,distToGenerator:s.gen.on&&sk?d:99});
    for(const z of s.zombies||[]){if(!z.gr&&z.x<GW+1){z.gr=1;GameAudio.growl(Math.hypot(wx(z.x)-cam3.tx,wz(z.y)-cam3.tz)+cam3.d*.35);}}}
}
// красный край экрана, когда до поражения близко: недовольство выше 70 или надежда ниже 25
function dangerTick(t){let el=document.getElementById('danger');
  const k=ui.mode==='game'&&S&&!S.over?Math.max(0,Math.min(1,Math.max((S.disc-70)/25,(25-S.hope)/20))):0;
  if(!el){if(!k)return;el=document.createElement('div');el.id='danger';document.body.appendChild(el);}
  el.style.opacity=k?(.25+.4*k)*(.8+.2*Math.sin(t/(700-300*k))):0;}
function loop(t){
  audioTick(t);
  dangerTick(t);
  const dt=Math.min(.1,(t-last)/1000);last=t;
  if(ui.mode==='game'&&S){
    const modal=S.queue.length>0&&!ui.evMin;
    if(coop.role!=='guest'&&!S.over&&!S.paused&&!(modal&&!S.survivor)){
      S.acc+=dt*S.speed/5; // 1 игровой час ≈ 5 с на ×1
      S.playSec=(S.playSec||0)+dt; // счёт: 1 очко за каждую прожитую минуту игры
      combatStep(S,dt*S.speed/5);upgradeStep(S,dt*S.speed/5);
      let n=0;while(S.acc>=1&&n<6){S.acc-=1;hourTick(S);syncTeams(S);n++;ui.dirty=true;}
    }
    if(coop.role==='host')coopPush();
    allyPublish();
    stepParticles();
    if(ui.open==='map'){$('mapwrap').hidden=false;renderMap(t);}
    else{$('mapwrap').hidden=true;draw(t);}
    uiT+=dt;rateT+=dt;
    if(rateT>=5&&prevRes){for(const k in S.res)resRate[k]=(S.res[k]-prevRes[k])/rateT*5*(S.paused?0:1);prevRes={...S.res};rateT=0;}
    if(ui.dirty||uiT>.5){uiT=0;ui.dirty=false;renderTop();renderBar();renderInfo();renderEvFeed();if(ui.open==='map')renderMapSide();renderOverlay();}
    if(ui.toMenu){ui.toMenu=false;if(S&&S.over)store('ls_save','');coopStop();ui.mode='menu';ui.menuScr='main';renderMenu();}
  }else if(ui.mode==='menu'){draw(t);}
  document.body.classList.toggle('inmenu',ui.mode!=='game');
  flushToasts(t);
  requestAnimationFrame(loop);
}
function draw(t){if(R3.ok&&S){render3D(t);overlay3D(t);}else render(t);}
function flushToasts(t){
  const box=$('toasts');
  while(toastQ.length){const q=toastQ.shift();const d=document.createElement('div');d.className='toast panel '+(q.k||'');d.textContent=tr(q.txt);box.prepend(d);setTimeout(()=>d.remove(),6000);}
  while(box.children.length>6)box.lastChild.remove();
}

/* ---------------------------- ВВОД ---------------------------- */
let drag=null;
function onDown(e,isMap){drag={x:e.clientX,y:e.clientY,moved:false,map:isMap,cx:isMap?mcam.x:cam.x,cy:isMap?mcam.y:cam.y,rot:e.button===2,base:{...cam3}};}
function onMove(e){
  if(!drag){if(ui.mode==='game'&&S&&ui.open!=='map')ui.hover=screenToTile(e.clientX,e.clientY);return;}
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)drag.moved=true;
  if(drag.moved){if(drag.map){mcam.x=drag.cx-dx/mcam.z;mcam.y=drag.cy-dy/mcam.z;}
    else if(R3.ok){if(drag.rot){cam3.yaw=drag.base.yaw-dx*.006;cam3.pitch=drag.base.pitch+dy*.004;}else pan3D(dx,dy,drag.base);}
    else{cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z;}}
  if(!drag.map)ui.hover=screenToTile(e.clientX,e.clientY);
}
function onUp(e){
  if(!drag)return;const d=drag;drag=null;if(d.moved)return;
  if(d.rot){ui.buildType=null;ui.sel=null;ui.dirty=true;return;}
  if(d.map){mapClick(e.clientX,e.clientY);return;}
  if(ui.mode!=='game'||!S)return;
  const tl=screenToTile(e.clientX,e.clientY);
  if(ui.buildType){if(canPlace(S,ui.buildType,tl.x,tl.y)&&canAfford(S,buildCost(S,ui.buildType))){dispatch({t:'build',type:ui.buildType,x:tl.x,y:tl.y});if(!e.shiftKey)ui.buildType=null;}return;}
  if(tl.x<0||tl.y<0||tl.x>=GW||tl.y>=GH){ui.sel=null;ui.dirty=true;return;}
  const t=tile(S,tl.x,tl.y);
  if(t.b===-1)ui.sel={k:'gen'};else if(t.b)ui.sel={k:'b',id:t.b};else if(t.pile)ui.sel={k:'p',x:tl.x,y:tl.y};else ui.sel=null;
  ui.dirty=true;
}
function mapClick(x,y){
  const m=s2m(x,y);let best=null,bd=1e9;
  for(const id in G.nodes){if(!S.st[id])continue;const n=G.nodes[id];const d=Math.hypot(n.x-m.x,n.y-m.y);if(d<bd){bd=d;best=id;}}
  for(const tm of S.teams){const q=posOn(tm);if(Math.hypot(q.x-x,q.y-y)<12){ui.team=tm.id;ui.dirty=true;return;}}
  ui.mapSel=bd*mcam.z<18?best:null;ui.dirty=true;
}
cv.addEventListener('pointerdown',e=>onDown(e,false));
$('mapc').addEventListener('pointerdown',e=>onDown(e,true));
addEventListener('pointermove',onMove);
addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');const el=$('tip');
  if(!t||ui.mode!=='game'){if(!el.hidden)el.hidden=true;return;}
  setHTML(el,tipHTML(t.dataset.tip));el.hidden=false;const w=el.offsetWidth,h=el.offsetHeight;
  el.style.left=clamp(e.clientX-w/2,8,innerWidth-w-8)+'px';el.style.top=Math.max(8,e.clientY-h-16)+'px';});addEventListener('pointerup',onUp);
cv.addEventListener('wheel',e=>{e.preventDefault();if(R3.ok)cam3.d*=e.deltaY<0?.9:1.11;else cam.z=clamp(cam.z*(e.deltaY<0?1.1:.9),.4,2.5);},{passive:false});
$('mapc').addEventListener('wheel',e=>{e.preventDefault();const before=s2m(e.clientX,e.clientY);mcam.z=clamp(mcam.z*(e.deltaY<0?1.12:.89),.35,3.5);const after=s2m(e.clientX,e.clientY);mcam.x+=before.x-after.x;mcam.y+=before.y-after.y;},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
// щипок на телефоне
const pts=new Map();let pinch0=null;
function pinchHandler(isMap){return e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(!pinch0)pinch0={d,z:isMap?mcam.z:cam.z,d3:cam3.d};else{const z=pinch0.z*d/pinch0.d;if(isMap)mcam.z=clamp(z,.35,3.5);else if(R3.ok)cam3.d=pinch0.d3*pinch0.d/d;else cam.z=clamp(z,.4,2.5);}drag=null;}};}
cv.addEventListener('pointermove',pinchHandler(false));$('mapc').addEventListener('pointermove',pinchHandler(true));
addEventListener('pointerup',e=>{pts.delete(e.pointerId);if(pts.size<2)pinch0=null;});
addEventListener('pointercancel',e=>{pts.delete(e.pointerId);pinch0=null;drag=null;});

function toggleFull(){const d=document;if(!d.fullscreenElement){(d.documentElement.requestFullscreen?d.documentElement.requestFullscreen():Promise.reject()).catch(()=>{toast(S,'Браузер не разрешил полноэкранный режим','');});}else d.exitFullscreen&&d.exitFullscreen().catch(()=>{});}
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='f'||e.key==='F'||e.key==='а'||e.key==='А'){toggleFull();return;}
  if(ui.mode!=='game'||!S)return;
  if(e.key==='Escape'){if(ui.buildType)ui.buildType=null;else if(ui.open)ui.open=null;else if(ui.cat)ui.cat=null;else ui.sel=null;ui.dirty=true;}
  if(e.key===' '){e.preventDefault();dispatch({t:'speed',v:S.paused?(S.speed||1):0});}
  if(e.key==='1'||e.key==='2'||e.key==='3'){const v=+e.key;if(!(S.survivor&&v>2))dispatch({t:'speed',v});}
  if(e.key==='m'||e.key==='M'||e.key==='ь'||e.key==='Ь'){ui.open=ui.open==='map'?null:'map';ui.dirty=true;}
  if(e.key==='q'||e.key==='Q'||e.key==='й'||e.key==='Й')cam3.yaw+=.15;
  if(e.key==='e'||e.key==='E'||e.key==='у'||e.key==='У')cam3.yaw-=.15;
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const ds=b.dataset;
  if(ds.speed!=null){dispatch({t:'speed',v:+ds.speed});}
  else if(ds.ev!=null){evGo(+ds.ev);}
  else if(ds.fc){ui.fcMin=!ui.fcMin;store('ls_fcmin',ui.fcMin?'1':'');ui.dirty=true;}
  else if(ds.evf){ui.evF=ds.evf;ui.dirty=true;}
  else if(ds.cat){ui.cat=ui.cat===ds.cat?null:ds.cat;ui.buildType=null;}
  else if(ds.build){ui.buildType=ds.build;ui.sel=null;}
  else if(ds.open){ui.open=ui.open===ds.open?null:ds.open;ui.cat=null;if(ds.open==='map'&&S.teams.length&&!ui.team)ui.team=S.teams[0].id;}
  else if(ds.work!=null){const n=+ds.n,who=ds.who||undefined;if(ds.work==='p')dispatch({t:'work',x:+ds.x,y:+ds.y,n,who});else dispatch({t:'work',id:+ds.work,n,who});}
  else if(ds.allyraid){allyRaid(ds.allyraid);}
  else if(ds.scr){ui.menuScr=ds.scr;ui.menuSave=!!ds.save;renderMenu();return;}
  else if(ds.slotsave){slotSave(+ds.slotsave);renderMenu();return;}
  else if(ds.slotload){slotLoad(+ds.slotload);return;}
  else if(ds.slotdel){store('ls_slot'+ds.slotdel,'');renderMenu();return;}
  else if(ds.allysend){const sel=document.getElementById('ar-'+ds.allysend);if(sel)allySend(ds.allysend,sel.value,+ds.n);}
  else if(ds.toggle)dispatch({t:'toggle',id:+ds.toggle});
  else if(ds.upgrade)dispatch({t:'upgrade',id:+ds.upgrade});
  else if(ds.taunt)dispatch({t:'taunt',id:+ds.taunt});
  else if(ds.insulate)dispatch({t:'insulate',id:+ds.insulate});
  else if(ds.emerg)dispatch({t:'emerg',id:+ds.emerg});
  else if(ds.demolish){dispatch({t:'demolish',id:+ds.demolish});ui.sel=null;}
  else if(ds.gen)dispatch({t:'gen',k:ds.gen,d:+(ds.d||0)});
  else if(ds.research)dispatch({t:'research',id:ds.research});
  else if(ds.law)dispatch({t:'law',id:ds.law});
  else if(ds.choose!=null)dispatch({t:'choose',i:+ds.choose});
  else if(ds.team){ui.team=+ds.team;}
  else if(ds.send){if(ui.team!=null)dispatch({t:'send',team:ui.team,to:ds.send});}
  else if(ds.outpost)dispatch({t:'outpost',at:ds.outpost});
  else if(ds.trade!=null)dispatch({t:'trade',team:+ds.tteam,i:+ds.trade});
  else if(ds.diff){ui.diff=ds.diff;renderMenu();return;}
  else if(ds.lang){setLang(ds.lang);return;}
  else if(ds.act){
    const a=ds.act;
    if(a==='close')ui.open=null;
    else if(a==='closemap')ui.open=null;
    else if(a==='unsel')ui.sel=null;
    else if(a==='heat')ui.heatView=!ui.heatView;
    else if(a==='labels')ui.labels=ui.labels===false;
    else if(a==='evmin')ui.evMin=true;
    else if(a==='evopen')ui.evMin=false;
    else if(a==='needs')ui.needsHidden=!ui.needsHidden;
    else if(a==='allynew'||a==='allyjoin'){if(!S)return;const code=a==='allynew'?Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[ri(0,31)]).join(''):String($('allycode').value||'').trim().toUpperCase();
      if(!/^[A-Z0-9]{5}$/.test(code)){ally.status='Введите код из 5 символов.';ui.dirty=true;$('overlay')._h=null;return;}
      S.ally={code,me:'s'+Math.random().toString(36).slice(2,9),name:String($('allyname').value||'Станция').slice(0,24)};autosave(S);allyConnect(S);$('overlay')._h=null;}
    else if(a==='allyleave'){if(S){S.ally=null;allyStop();autosave(S);}$('overlay')._h=null;}
    else if(a==='full')toggleFull();
    else if(a==='menu'){if(S&&coop.role!=='guest')autosave(S);ui.mode='menu';ui.menuScr='main';renderMenu();return;}
    else if(a==='new'){coopStop();ui.survivor=$('survivor').checked;ui.oneDeath=$('onedeath').checked;ui.oneSave=$('onesave').checked;S=newGame(ui.diff,ui.survivor);S.oneDeath=ui.oneDeath;S.oneSave=ui.oneSave;ui.menuScr='main';cam.x=0;cam.y=0;startGame();}
    else if(a==='load'){coopStop();const sv=loadSave();if(sv){S=sv;startGame();}}
    else if(a==='resume'){startGame(coop.role==='guest');}
    else if(a==='host'){ui.survivor=$('survivor').checked;ui.oneDeath=$('onedeath').checked;coop.status='создаём…';coopHost();return;}
    else if(a==='join'){coopJoin($('joincode').value);return;}
  }
  ui.dirty=true;
});
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{if(window.GameAudio)GameAudio.init();},{passive:true}));
addEventListener('input',e=>{if(!window.GameAudio)return;if(e.target.id==='musvol')GameAudio.setMusicVolume(e.target.value);if(e.target.id==='hudvol'||e.target.id==='mastervol'){GameAudio.setMasterVolume(e.target.value);const o=$(e.target.id==='hudvol'?'mastervol':'hudvol');if(o)o.value=e.target.value;}if(e.target.id==='sfxvol')GameAudio.setSfxVolume(e.target.value);});
addEventListener('change',e=>{if(e.target.id==='survivor')ui.survivor=e.target.checked;if(e.target.id==='onedeath')ui.oneDeath=e.target.checked;if(e.target.id==='onesave')ui.oneSave=e.target.checked;if(e.target.id==='art2d'){ART2D=e.target.checked;try{localStorage.setItem('ls_art2d',ART2D?'1':'0');}catch(_){}}});

/* ---------------------------- СТАРТ ---------------------------- */
function boot(data){
  document.documentElement.lang=LANG;
  try{init3D();}catch(e){R3.ok=false;console.error("init3D failed:",e&&e.message,e&&e.stack&&e.stack.split("\n")[1]);}
  resize();
  const pl=document.createElement('div');pl.id='popline';{const box=document.createElement('div');box.id='resbox';box.className='panel';const rs=$('res');rs.parentNode.insertBefore(box,rs);rs.classList.remove('panel');box.append(rs,pl);}
  if(data&&data.s){try{S=JSON.parse(data.s);startGame();}catch(e){S=null;}}
  if(!S){S=null;ui.mode='menu';renderMenu();}
  requestAnimationFrame(loop);
}
if(window.claude&&window.claude.hot)window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({s:S&&coop.role!=='guest'?JSON.stringify(S):null}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
